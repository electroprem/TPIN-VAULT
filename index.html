<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>TPIN Vault</title>
    <meta name="theme-color" content="#020617">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/png" href="https://cdn-icons-png.flaticon.com/512/11528/11528763.png">
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/11528/11528763.png">

    <style>
        :root {
            --bg: #05070a;
            --glass: rgba(15, 23, 42, 0.75);
            --glass-hover: rgba(20, 30, 55, 0.85);
            --accent: #00d2ff;
            --accent-purple: #9d50bb;
            --text: #f1f5f9;
            --text-dim: #64748b;
            --text-muted: #475569;
            --success: #10b981;
            --danger: #ef4444;
            --danger-dim: rgba(239, 68, 68, 0.15);
            --border: rgba(255,255,255,0.06);
            --border-focus: rgba(0, 210, 255, 0.4);
            --radius: 20px;
            --radius-sm: 12px;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; outline: none; }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background-color: var(--bg);
            background-image:
                radial-gradient(at 0% 0%, rgba(0, 210, 255, 0.12) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(157, 80, 187, 0.12) 0px, transparent 50%),
                radial-gradient(at 60% 40%, rgba(0, 210, 255, 0.04) 0px, transparent 40%);
            color: var(--text);
            margin: 0;
            min-height: 100vh;
            padding: max(env(safe-area-inset-top), 0px) 16px 180px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .app { width: 100%; max-width: 480px; }

        /* ── Install Banner ── */
        #install-banner {
            display: none;
            background: linear-gradient(135deg, rgba(0,210,255,0.12), rgba(157,80,187,0.12));
            border: 1px solid rgba(0,210,255,0.2);
            padding: 14px 16px;
            border-radius: var(--radius);
            margin-bottom: 20px;
            backdrop-filter: blur(20px);
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            width: 100%;
            animation: slideDown 0.4s ease;
        }
        #install-banner .banner-text {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 0.82rem;
            font-weight: 500;
        }
        #install-banner .banner-icon { font-size: 1.2rem; }
        #install-banner .banner-actions { display: flex; gap: 8px; flex-shrink: 0; }
        .btn-dismiss {
            background: none;
            border: none;
            color: var(--text-dim);
            font-size: 0.75rem;
            cursor: pointer;
            padding: 6px 10px;
            border-radius: 8px;
        }
        .btn-dismiss:hover { color: var(--text); }
        .btn-install-small {
            background: linear-gradient(135deg, var(--accent), var(--accent-purple));
            border: none;
            padding: 6px 14px;
            border-radius: 10px;
            font-weight: 700;
            font-size: 0.75rem;
            color: white;
            cursor: pointer;
        }

        /* ── Header ── */
        header {
            padding: 24px 0 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .logo-area { display: flex; flex-direction: column; gap: 2px; }
        .logo {
            font-size: 1rem;
            letter-spacing: 5px;
            text-transform: uppercase;
            font-weight: 900;
            background: linear-gradient(90deg, var(--accent), var(--accent-purple));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .logo-sub { font-size: 0.6rem; color: var(--text-muted); letter-spacing: 2px; text-transform: uppercase; }
        .header-badge {
            background: var(--glass);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 6px 12px;
            font-size: 0.7rem;
            color: var(--text-dim);
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .header-badge .dot {
            width: 6px; height: 6px;
            border-radius: 50%;
            background: var(--success);
            box-shadow: 0 0 6px var(--success);
        }

        /* ── Search ── */
        .search-wrap {
            position: relative;
            margin-bottom: 20px;
        }
        .search-icon {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-dim);
            pointer-events: none;
            font-size: 0.9rem;
        }
        .search-input {
            width: 100%;
            padding: 15px 44px 15px 44px;
            background: var(--glass);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            color: var(--text);
            font-size: 0.9rem;
            transition: border-color 0.2s, background 0.2s;
        }
        .search-input:focus {
            border-color: var(--border-focus);
            background: var(--glass-hover);
        }
        .search-input::placeholder { color: var(--text-dim); }
        #search-clear {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(255,255,255,0.08);
            border: none;
            color: var(--text-dim);
            width: 26px; height: 26px;
            border-radius: 50%;
            cursor: pointer;
            display: none;
            align-items: center;
            justify-content: center;
            font-size: 0.75rem;
            transition: background 0.2s;
        }
        #search-clear:hover { background: rgba(255,255,255,0.15); color: var(--text); }
        #search-clear.visible { display: flex; }

        /* ── Section label ── */
        .section-label {
            font-size: 0.65rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: var(--text-muted);
            margin-bottom: 12px;
            padding: 0 4px;
        }

        /* ── Cards ── */
        .card {
            background: var(--glass);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 14px 16px;
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 10px;
            transition: border-color 0.2s, transform 0.15s;
            animation: cardIn 0.35s ease both;
        }
        .card:hover { border-color: rgba(255,255,255,0.1); }
        .card:active { transform: scale(0.99); }

        .avatar {
            width: 42px; height: 42px;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1rem;
            font-weight: 800;
            color: white;
            flex-shrink: 0;
            text-transform: uppercase;
            letter-spacing: -0.5px;
        }

        .card-info { flex: 1; min-width: 0; }
        .card-name {
            font-size: 0.92rem;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-bottom: 2px;
        }
        .card-date { font-size: 0.68rem; color: var(--text-dim); }

        .card-actions { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }

        .pin-box {
            display: flex;
            align-items: center;
            gap: 6px;
            background: rgba(0,0,0,0.3);
            border: 1px solid rgba(255,255,255,0.05);
            border-radius: var(--radius-sm);
            padding: 8px 10px;
        }
        .pin-text {
            font-family: 'Courier New', monospace;
            font-size: 0.85rem;
            color: var(--accent);
            letter-spacing: 2px;
            min-width: 54px;
            text-align: center;
            user-select: none;
        }
        .icon-btn {
            background: none;
            border: none;
            cursor: pointer;
            color: var(--text-dim);
            padding: 4px;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: color 0.15s, background 0.15s;
            font-size: 0.85rem;
        }
        .icon-btn:hover { color: var(--text); background: rgba(255,255,255,0.08); }
        .icon-btn.copy-btn:hover { color: var(--accent); }
        .icon-btn.del-btn:hover { color: var(--danger); background: var(--danger-dim); }

        /* ── Empty state ── */
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            animation: fadeIn 0.4s ease;
        }
        .empty-icon {
            font-size: 3rem;
            opacity: 0.4;
            filter: grayscale(0.5);
        }
        .empty-title {
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--text-dim);
        }
        .empty-hint {
            font-size: 0.75rem;
            color: var(--text-muted);
            max-width: 200px;
            line-height: 1.5;
        }

        /* ── Dock ── */
        .dock {
            position: fixed;
            bottom: max(env(safe-area-inset-bottom), 20px);
            left: 50%;
            transform: translateX(-50%);
            width: calc(100% - 32px);
            max-width: 440px;
            background: rgba(10, 15, 25, 0.95);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 26px;
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            z-index: 100;
            box-shadow: 0 -4px 40px rgba(0,0,0,0.5), 0 0 0 0.5px rgba(255,255,255,0.05);
        }
        .dock-fields { display: flex; gap: 8px; }
        .dock-field {
            position: relative;
            flex: 1;
            min-width: 0;
        }
        .dock-input {
            width: 100%;
            background: rgba(255,255,255,0.06);
            border: 1px solid rgba(255,255,255,0.07);
            border-radius: 16px;
            padding: 13px 14px;
            color: var(--text);
            font-size: 0.9rem;
            transition: border-color 0.2s, background 0.2s;
        }
        .dock-input:focus {
            border-color: var(--border-focus);
            background: rgba(255,255,255,0.08);
        }
        .dock-input::placeholder { color: var(--text-muted); }
        .dock-input.error { border-color: rgba(239,68,68,0.5) !important; }

        .pin-toggle {
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: var(--text-dim);
            cursor: pointer;
            padding: 4px;
            display: flex;
            align-items: center;
            font-size: 0.85rem;
        }
        #tpin { padding-right: 36px; }

        .dock-row { display: flex; gap: 8px; }
        .btn-add {
            background: linear-gradient(135deg, var(--accent), var(--accent-purple));
            color: white;
            border: none;
            border-radius: 16px;
            height: 48px;
            padding: 0 24px;
            font-weight: 700;
            font-size: 0.85rem;
            cursor: pointer;
            letter-spacing: 0.5px;
            transition: opacity 0.2s, transform 0.1s;
            display: flex;
            align-items: center;
            gap: 6px;
            white-space: nowrap;
        }
        .btn-add:active { transform: scale(0.97); opacity: 0.9; }
        .dock-hint {
            font-size: 0.65rem;
            color: var(--text-muted);
            text-align: center;
            letter-spacing: 0.5px;
        }
        .dock-hint span { color: var(--danger); font-weight: 600; }

        /* ── Toast ── */
        #toast {
            position: fixed;
            top: max(env(safe-area-inset-top), 16px);
            left: 50%;
            transform: translateX(-50%) translateY(calc(-100% - 20px));
            padding: 10px 20px;
            border-radius: 30px;
            font-size: 0.78rem;
            font-weight: 600;
            letter-spacing: 0.5px;
            transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.4s;
            z-index: 2000;
            pointer-events: none;
            display: flex;
            align-items: center;
            gap: 8px;
            white-space: nowrap;
            backdrop-filter: blur(10px);
        }
        #toast.show { transform: translateX(-50%) translateY(0); }
        #toast.success { background: rgba(16, 185, 129, 0.95); color: white; box-shadow: 0 4px 20px rgba(16,185,129,0.4); }
        #toast.error   { background: rgba(239, 68, 68, 0.95);  color: white; box-shadow: 0 4px 20px rgba(239,68,68,0.4); }

        /* ── Delete Modal ── */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(4px);
            z-index: 500;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            padding: 0 16px max(env(safe-area-inset-bottom), 20px);
            animation: fadeIn 0.2s ease;
        }
        .modal-overlay.hidden { display: none; }
        .modal-sheet {
            background: #0f172a;
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 24px 24px 20px 20px;
            padding: 24px;
            width: 100%;
            max-width: 440px;
            animation: slideUp 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            text-align: center;
        }
        .modal-icon { font-size: 2.5rem; margin-bottom: 12px; }
        .modal-title { font-size: 1rem; font-weight: 700; margin-bottom: 6px; }
        .modal-body { font-size: 0.82rem; color: var(--text-dim); margin-bottom: 20px; }
        .modal-actions { display: flex; gap: 10px; }
        .btn-cancel {
            flex: 1; background: rgba(255,255,255,0.07); border: 1px solid rgba(255,255,255,0.1);
            color: var(--text); border-radius: 14px; padding: 14px; font-size: 0.9rem;
            font-weight: 600; cursor: pointer; transition: background 0.2s;
        }
        .btn-cancel:hover { background: rgba(255,255,255,0.12); }
        .btn-confirm-del {
            flex: 1; background: linear-gradient(135deg, #ef4444, #b91c1c); border: none;
            color: white; border-radius: 14px; padding: 14px; font-size: 0.9rem;
            font-weight: 700; cursor: pointer; transition: opacity 0.2s;
        }
        .btn-confirm-del:hover { opacity: 0.9; }

        /* ── Animations ── */
        @keyframes fadeIn    { from { opacity: 0; } to { opacity: 1; } }
        @keyframes slideDown { from { opacity: 0; transform: translateY(-12px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes slideUp   { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes cardIn    { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* ── Scrollbar ── */
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 4px; }
    </style>
</head>
<body>

<div id="toast" class="success" role="status" aria-live="polite"></div>

<!-- Delete confirmation bottom sheet -->
<div id="del-modal" class="modal-overlay hidden" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <div class="modal-sheet">
        <div class="modal-icon">🗑️</div>
        <div class="modal-title" id="modal-title">Delete Entry?</div>
        <div class="modal-body" id="modal-body">This action cannot be undone.</div>
        <div class="modal-actions">
            <button class="btn-cancel" onclick="closeModal()">Cancel</button>
            <button class="btn-confirm-del" id="btn-confirm-del">Delete</button>
        </div>
    </div>
</div>

<div class="app">
    <div id="install-banner">
        <div class="banner-text">
            <span class="banner-icon">⚡</span>
            <span>Install TPIN Vault for offline access</span>
        </div>
        <div class="banner-actions">
            <button class="btn-dismiss" onclick="document.getElementById('install-banner').style.display='none'" aria-label="Dismiss">✕</button>
            <button id="btn-install" class="btn-install-small">Install</button>
        </div>
    </div>

    <header>
        <div class="logo-area">
            <div class="logo">TPIN VAULT</div>
            <div class="logo-sub">Secure Local Storage</div>
        </div>
        <div class="header-badge">
            <span class="dot"></span>
            <span id="entry-count">0 entries</span>
        </div>
    </header>

    <div class="search-wrap">
        <span class="search-icon">🔍</span>
        <input type="text" id="search" class="search-input" placeholder="Search by name…" autocomplete="off" oninput="onSearch()" aria-label="Search entries">
        <button id="search-clear" class="icon-btn" onclick="clearSearch()" aria-label="Clear search">✕</button>
    </div>

    <div class="section-label" id="section-label"></div>
    <div id="vault-list" role="list"></div>
</div>

<div class="dock" role="form" aria-label="Add new entry">
    <div class="dock-fields">
        <div class="dock-field">
            <input type="text" id="owner" class="dock-input" placeholder="Name" autocomplete="off" aria-label="Name" maxlength="30" onkeydown="dockKeydown(event)">
        </div>
        <div class="dock-field">
            <input type="password" id="tpin" class="dock-input" placeholder="PIN" inputmode="numeric" maxlength="6" aria-label="PIN" onkeydown="dockKeydown(event)">
            <button type="button" class="pin-toggle" id="pin-toggle" onclick="togglePinVisibility()" aria-label="Toggle PIN visibility">👁️</button>
        </div>
    </div>
    <div class="dock-row">
        <button class="btn-add" onclick="addItem()" aria-label="Add entry">
            <span>+</span> Add Entry
        </button>
    </div>
</div>

<script>
    let vault = JSON.parse(localStorage.getItem('tpin_v4')) || [];
    let deferredPrompt;
    let pendingDeleteId = null;

    // Avatar palette – 8 gradient pairs
    const AVATARS = [
        ['#00d2ff','#3a7bd5'], ['#f093fb','#f5576c'], ['#4facfe','#00f2fe'],
        ['#43e97b','#38f9d7'], ['#fa709a','#fee140'], ['#a18cd1','#fbc2eb'],
        ['#ffecd2','#fcb69f'], ['#30cfd0','#667eea'],
    ];

    function avatarGrad(name) {
        const idx = (name.charCodeAt(0) + (name.charCodeAt(1) || 0)) % AVATARS.length;
        return AVATARS[idx];
    }

    function initials(name) {
        const parts = name.trim().split(/\s+/);
        return parts.length >= 2
            ? (parts[0][0] + parts[parts.length - 1][0]).toUpperCase()
            : name.slice(0, 2).toUpperCase();
    }

    // ── PWA Install ──
    window.addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault();
        deferredPrompt = e;
        if (!window.matchMedia('(display-mode: standalone)').matches) {
            document.getElementById('install-banner').style.display = 'flex';
        }
    });

    document.getElementById('btn-install').addEventListener('click', async () => {
        if (!deferredPrompt) return;
        deferredPrompt.prompt();
        const { outcome } = await deferredPrompt.userChoice;
        if (outcome === 'accepted') document.getElementById('install-banner').style.display = 'none';
        deferredPrompt = null;
    });

    // ── Toast ──
    function showToast(msg, type = 'success') {
        const t = document.getElementById('toast');
        t.textContent = msg;
        t.className = type;
        t.classList.add('show');
        clearTimeout(t._timer);
        t._timer = setTimeout(() => t.classList.remove('show'), 2200);
    }

    // ── Delete Modal ──
    function confirmDelete(id, name) {
        pendingDeleteId = id;
        document.getElementById('modal-body').textContent = `"${name}" will be permanently removed.`;
        document.getElementById('del-modal').classList.remove('hidden');
        document.getElementById('btn-confirm-del').focus();
    }

    function closeModal() {
        pendingDeleteId = null;
        document.getElementById('del-modal').classList.add('hidden');
    }

    document.getElementById('btn-confirm-del').addEventListener('click', () => {
        if (pendingDeleteId !== null) {
            vault = vault.filter(i => i.id !== pendingDeleteId);
            save();
            showToast('🗑️  Entry deleted', 'error');
        }
        closeModal();
    });

    document.getElementById('del-modal').addEventListener('click', (e) => {
        if (e.target === e.currentTarget) closeModal();
    });

    document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') closeModal();
    });

    // ── PIN Visibility Toggle ──
    function togglePinVisibility() {
        const input = document.getElementById('tpin');
        const btn = document.getElementById('pin-toggle');
        const isHidden = input.type === 'password';
        input.type = isHidden ? 'text' : 'password';
        btn.textContent = isHidden ? '🙈' : '👁️';
    }

    // ── Add Entry ──
    function addItem() {
        const oEl = document.getElementById('owner');
        const tEl = document.getElementById('tpin');
        const o = oEl.value.trim();
        const t = tEl.value.trim();
        oEl.classList.toggle('error', !o);
        tEl.classList.toggle('error', !t);

        if (!o || !t) {
            if (!o) { oEl.focus(); }
            else { tEl.focus(); }
            showToast('⚠️  Fill in all fields', 'error');
            return;
        }

        vault.unshift({
            id: Date.now(),
            owner: o,
            tpin: t,
            date: new Date().toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' })
        });
        oEl.value = '';
        tEl.value = '';
        oEl.classList.remove('error');
        tEl.classList.remove('error');
        // Reset PIN field to password type
        document.getElementById('tpin').type = 'password';
        document.getElementById('pin-toggle').textContent = '👁️';
        save();
        showToast('✅  Entry saved');
        if (navigator.vibrate) navigator.vibrate(40);
    }

    // Allow Enter key to submit from dock
    function dockKeydown(e) {
        if (e.key === 'Enter') addItem();
    }

    // ── Copy PIN ──
    function copyPin(pin) {
        navigator.clipboard.writeText(pin).then(() => {
            showToast('📋  PIN copied!');
            if (navigator.vibrate) navigator.vibrate(30);
        }).catch(() => showToast('Copy failed', 'error'));
    }

    // ── Toggle PIN reveal per card ──
    function toggleReveal(spanEl, btn, pin) {
        const revealed = spanEl.dataset.revealed === 'true';
        if (revealed) {
            spanEl.textContent = '••••••';
            spanEl.dataset.revealed = 'false';
            btn.textContent = '👁️';
            btn.setAttribute('aria-label', 'Show PIN');
        } else {
            spanEl.textContent = pin;
            spanEl.dataset.revealed = 'true';
            btn.textContent = '🙈';
            btn.setAttribute('aria-label', 'Hide PIN');
            setTimeout(() => {
                if (spanEl.dataset.revealed === 'true') {
                    spanEl.textContent = '••••••';
                    spanEl.dataset.revealed = 'false';
                    btn.textContent = '👁️';
                }
            }, 5000);
        }
    }

    // ── Search ──
    function onSearch() {
        const val = document.getElementById('search').value;
        const clearBtn = document.getElementById('search-clear');
        clearBtn.classList.toggle('visible', val.length > 0);
        render();
    }

    function clearSearch() {
        document.getElementById('search').value = '';
        document.getElementById('search-clear').classList.remove('visible');
        render();
        document.getElementById('search').focus();
    }

    // ── Save & Render ──
    function save() {
        localStorage.setItem('tpin_v4', JSON.stringify(vault));
        render();
    }

    function render() {
        const list = document.getElementById('vault-list');
        const q = document.getElementById('search').value.toLowerCase().trim();
        list.innerHTML = '';

        const filtered = vault.filter(i => i.owner.toLowerCase().includes(q));

        // Update header count
        const countEl = document.getElementById('entry-count');
        countEl.textContent = vault.length === 1 ? '1 entry' : `${vault.length} entries`;

        // Section label
        const labelEl = document.getElementById('section-label');
        if (filtered.length) {
            labelEl.textContent = q
                ? `${filtered.length} result${filtered.length !== 1 ? 's' : ''} for "${q}"`
                : `${filtered.length} stored ${filtered.length === 1 ? 'entry' : 'entries'}`;
        } else {
            labelEl.textContent = '';
        }

        if (!filtered.length) {
            const empty = document.createElement('div');
            empty.className = 'empty-state';

            const icon = document.createElement('div');
            icon.className = 'empty-icon';
            icon.textContent = q ? '🔎' : '🔒';

            const title = document.createElement('div');
            title.className = 'empty-title';
            title.textContent = q ? 'No results found' : 'No entries yet';

            const hint = document.createElement('div');
            hint.className = 'empty-hint';
            hint.textContent = q ? `Nothing matches "${q}"` : 'Add your first TPIN entry using the form below';

            empty.append(icon, title, hint);
            list.appendChild(empty);
            return;
        }

        filtered.forEach((item, idx) => {
            const [c1, c2] = avatarGrad(item.owner);
            const card = document.createElement('div');
            card.className = 'card';
            card.setAttribute('role', 'listitem');
            card.style.animationDelay = `${idx * 40}ms`;

            // Avatar
            const avatar = document.createElement('div');
            avatar.className = 'avatar';
            avatar.style.background = `linear-gradient(135deg,${c1},${c2})`;
            avatar.setAttribute('aria-hidden', 'true');
            avatar.textContent = initials(item.owner);

            // Info
            const cardInfo = document.createElement('div');
            cardInfo.className = 'card-info';
            const nameEl = document.createElement('div');
            nameEl.className = 'card-name';
            nameEl.textContent = item.owner;
            const dateEl = document.createElement('div');
            dateEl.className = 'card-date';
            dateEl.textContent = item.date || '';
            cardInfo.append(nameEl, dateEl);

            // PIN box
            const pinBox = document.createElement('div');
            pinBox.className = 'pin-box';

            const pinSpan = document.createElement('span');
            pinSpan.className = 'pin-text';
            pinSpan.dataset.revealed = 'false';
            pinSpan.textContent = '••••••';

            const revealBtn = document.createElement('button');
            revealBtn.className = 'icon-btn';
            revealBtn.title = 'Show/Hide PIN';
            revealBtn.setAttribute('aria-label', 'Show PIN');
            revealBtn.textContent = '👁️';
            revealBtn.addEventListener('click', () => toggleReveal(pinSpan, revealBtn, item.tpin));

            const copyBtn = document.createElement('button');
            copyBtn.className = 'icon-btn copy-btn';
            copyBtn.title = 'Copy PIN';
            copyBtn.setAttribute('aria-label', 'Copy PIN');
            copyBtn.textContent = '📋';
            copyBtn.addEventListener('click', () => copyPin(item.tpin));

            pinBox.append(pinSpan, revealBtn, copyBtn);

            // Delete button
            const delBtn = document.createElement('button');
            delBtn.className = 'icon-btn del-btn';
            delBtn.title = 'Delete entry';
            delBtn.setAttribute('aria-label', `Delete ${item.owner}`);
            delBtn.textContent = '🗑️';
            delBtn.addEventListener('click', () => confirmDelete(item.id, item.owner));

            // Card actions wrapper
            const actions = document.createElement('div');
            actions.className = 'card-actions';
            actions.append(pinBox, delBtn);

            card.append(avatar, cardInfo, actions);
            list.appendChild(card);
        });
    }

    // ── Service Worker ──
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => { navigator.serviceWorker.register('./sw.js'); });
    }

    render();
</script>
</body>
</html>
