<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Finance Vault</title>
    <meta name="theme-color" content="#111827">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/png" href="https://cdn-icons-png.flaticon.com/512/11528/11528763.png">
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/11528/11528763.png">

    <style>
        :root {
            --bg: #05070d;
            --glass: rgba(255, 255, 255, 0.08);
            --glass-strong: rgba(255, 255, 255, 0.14);
            --edge: rgba(255, 255, 255, 0.25);
            --text: #f8fafc;
            --text-dim: #bfd0e9;
            --accent: #8dc4ff;
            --accent-2: #c8b8ff;
            --success: #22c55e;
            --danger: #f87171;
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', system-ui, sans-serif;
            color: var(--text);
            background:
                radial-gradient(1200px 600px at -10% -10%, rgba(141, 196, 255, 0.32), transparent),
                radial-gradient(1100px 600px at 110% 110%, rgba(200, 184, 255, 0.26), transparent),
                radial-gradient(900px 500px at 50% 100%, rgba(255, 255, 255, 0.06), transparent),
                var(--bg);
            padding: env(safe-area-inset-top) 16px 190px;
            display: flex;
            justify-content: center;
        }

        .app {
            width: 100%;
            max-width: 520px;
        }

        #install-banner,
        .hero,
        .search-wrap,
        .card,
        .composer,
        #toast {
            backdrop-filter: blur(24px) saturate(180%);
            -webkit-backdrop-filter: blur(24px) saturate(180%);
            background: var(--glass);
            border: 1px solid var(--edge);
            box-shadow:
                0 20px 45px rgba(2, 8, 23, 0.35),
                inset 0 1px 0 rgba(255, 255, 255, 0.28);
        }

        #install-banner {
            display: none;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            padding: 12px;
            border-radius: 22px;
            margin-top: 12px;
        }

        .hero {
            margin-top: 16px;
            border-radius: 30px;
            padding: 20px;
            background: linear-gradient(145deg, rgba(255, 255, 255, 0.13), rgba(255, 255, 255, 0.06));
        }

        .brand {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 12px;
        }

        .brand h1 {
            margin: 0;
            font-size: 1.4rem;
            font-weight: 800;
            letter-spacing: 0.01em;
        }

        .logo-chip {
            font-size: 0.68rem;
            text-transform: uppercase;
            letter-spacing: 0.14em;
            color: #dbeafe;
            background: linear-gradient(135deg, rgba(96, 165, 250, 0.35), rgba(167, 139, 250, 0.32));
            border: 1px solid rgba(255, 255, 255, 0.25);
            border-radius: 999px;
            padding: 7px 10px;
            font-weight: 700;
            white-space: nowrap;
        }

        .subline,
        .meta {
            margin-top: 8px;
            color: var(--text-dim);
            font-size: 0.86rem;
        }

        .meta {
            font-size: 0.8rem;
            opacity: 0.95;
        }

        .search-wrap {
            margin-top: 14px;
            border-radius: 16px;
            padding: 10px 14px;
        }

        .search-wrap input {
            width: 100%;
            border: none;
            background: transparent;
            color: var(--text);
            font-size: 0.96rem;
        }

        .search-wrap input::placeholder,
        input::placeholder,
        textarea::placeholder {
            color: #8794ad;
        }

        .search-wrap input:focus,
        input:focus,
        select:focus,
        textarea:focus,
        button:focus-visible {
            outline: none;
        }

        #vault-list {
            margin-top: 16px;
        }

        .card {
            border-radius: 22px;
            padding: 14px;
            margin-bottom: 12px;
            background: linear-gradient(155deg, rgba(255, 255, 255, 0.12), rgba(255, 255, 255, 0.04));
        }

        .row-top,
        .row-main {
            display: flex;
            justify-content: space-between;
            gap: 10px;
            align-items: center;
        }

        .row-main {
            margin-top: 10px;
        }

        .pill {
            display: inline-flex;
            align-items: center;
            font-size: 0.68rem;
            font-weight: 700;
            border-radius: 999px;
            padding: 5px 10px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            background: rgba(96, 165, 250, 0.22);
            color: #e0f2fe;
            text-transform: uppercase;
            letter-spacing: 0.06em;
        }

        .owner {
            font-size: 1rem;
            font-weight: 700;
            line-height: 1.25;
        }

        .date,
        .notes {
            margin-top: 4px;
            color: var(--text-dim);
            font-size: 0.77rem;
        }

        .notes {
            max-width: 95%;
            word-break: break-word;
        }

        .secret-trigger {
            border: 1px solid rgba(255, 255, 255, 0.2);
            background: rgba(2, 6, 23, 0.35);
            color: #dbeafe;
            border-radius: 12px;
            min-width: 132px;
            max-width: 230px;
            text-align: center;
            font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
            font-size: 0.85rem;
            padding: 10px;
            cursor: pointer;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .btn-danger,
        .btn-soft,
        .btn-accent {
            border: none;
            border-radius: 12px;
            padding: 8px 10px;
            font-weight: 700;
            cursor: pointer;
        }

        .btn-danger {
            background: rgba(248, 113, 113, 0.18);
            color: #fecaca;
            border: 1px solid rgba(248, 113, 113, 0.3);
        }

        .composer {
            position: fixed;
            left: 50%;
            bottom: calc(18px + env(safe-area-inset-bottom));
            transform: translateX(-50%);
            width: calc(100% - 20px);
            max-width: 520px;
            border-radius: 28px;
            padding: 11px;
            z-index: 30;
            background: linear-gradient(160deg, rgba(255, 255, 255, 0.16), rgba(255, 255, 255, 0.06));
        }

        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }

        input,
        select,
        textarea {
            width: 100%;
            border: 1px solid rgba(255, 255, 255, 0.12);
            background: rgba(6, 12, 24, 0.45);
            color: var(--text);
            border-radius: 13px;
            font-size: 0.9rem;
            padding: 11px 12px;
        }

        textarea {
            margin-top: 8px;
            resize: none;
            min-height: 42px;
            max-height: 90px;
        }

        .actions {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            margin-top: 8px;
        }

        .local-note {
            font-size: 0.72rem;
            color: var(--text-dim);
            line-height: 1.35;
        }

        .btn-accent {
            background: linear-gradient(135deg, var(--accent), var(--accent-2));
            color: white;
            min-width: 110px;
        }

        .btn-soft {
            background: rgba(255, 255, 255, 0.08);
            color: #dbeafe;
            border: 1px solid rgba(255, 255, 255, 0.12);
        }

        #toast {
            position: fixed;
            top: calc(env(safe-area-inset-top) + 16px);
            left: 50%;
            transform: translateX(-50%) translateY(-120px);
            color: white;
            border-radius: 999px;
            padding: 10px 16px;
            font-size: 0.8rem;
            letter-spacing: 0.04em;
            transition: transform .3s ease;
            z-index: 90;
        }

        #toast.show {
            transform: translateX(-50%) translateY(0);
        }

        .empty {
            text-align: center;
            color: var(--text-dim);
            padding: 38px 20px;
            border: 1px dashed rgba(255, 255, 255, 0.2);
            border-radius: 18px;
            font-size: 0.84rem;
        }

        @media (max-width: 430px) {
            .grid {
                grid-template-columns: 1fr;
            }

            .secret-trigger {
                min-width: 118px;
            }

            .actions {
                align-items: flex-start;
                flex-direction: column;
            }

            .btn-accent {
                width: 100%;
            }
        }
    </style>
</head>
<body>

<div id="toast">Copied to clipboard</div>

<div class="app">
    <div id="install-banner">
        <span style="font-size: 0.78rem;">Install for full offline local access?</span>
        <div style="display: flex; gap: 8px;">
            <button class="btn-soft" id="btn-dismiss">Later</button>
            <button class="btn-accent" id="btn-install">Install</button>
        </div>
    </div>

    <section class="hero">
        <div class="brand">
            <div>
                <h1>Finance Vault</h1>
                <div class="subline">Store TPIN, UPI IDs, PAN, Demat and finance credentials only on your device.</div>
            </div>
            <div class="logo-chip">LOCAL ONLY</div>
        </div>
        <div class="meta" id="vault-meta">0 entries · Offline ready</div>
    </section>

    <div class="search-wrap">
        <input type="text" id="search" placeholder="Search by type, account label or notes" oninput="render()">
    </div>

    <div id="vault-list"></div>
</div>

<section class="composer">
    <div class="grid">
        <select id="entryType" aria-label="Entry type">
            <option>TPIN</option>
            <option>UPI ID</option>
            <option>PAN Card</option>
            <option>Demat Account</option>
            <option>Bank Account</option>
            <option>Broker Client ID</option>
            <option>Other</option>
        </select>
        <input type="text" id="owner" placeholder="Label / Institution" autocomplete="off" maxlength="80">
        <input type="text" id="secret" placeholder="Secret value" autocomplete="off" maxlength="120">
        <textarea id="notes" placeholder="Optional notes"></textarea>
    </div>
    <div class="actions">
        <div class="local-note">No cloud sync. Data stays in localStorage on this phone only.</div>
        <button class="btn-accent" onclick="addItem()">Save entry</button>
    </div>
</section>

<script>
    const STORAGE_KEY = 'finance_vault_v1';
    const LEGACY_KEY = 'tpin_v4';
    let vault = safeStorageRead(STORAGE_KEY, []);
    let deferredPrompt;

    function safeStorageRead(key, fallback) {
        try {
            const raw = localStorage.getItem(key);
            return raw ? JSON.parse(raw) : fallback;
        } catch {
            return fallback;
        }
    }

    // Avatar palette – 8 gradient pairs
    const AVATARS = [
        ['#00d2ff','#3a7bd5'], ['#f093fb','#f5576c'], ['#4facfe','#00f2fe'],
        ['#43e97b','#38f9d7'], ['#fa709a','#fee140'], ['#a18cd1','#fbc2eb'],
        ['#ffecd2','#fcb69f'], ['#30cfd0','#667eea'],
    ];

    function avatarGrad(name) {
        const idx = (name.charCodeAt(0) + (name.charCodeAt(1) || 0)) % AVATARS.length;
        return AVATARS[idx];
    }

    migrateLegacyData();

    window.addEventListener('beforeinstallprompt', (event) => {
        event.preventDefault();
        deferredPrompt = event;
        if (!window.matchMedia('(display-mode: standalone)').matches) {
            document.getElementById('install-banner').style.display = 'flex';
        }
    });

    const dismissButton = document.getElementById('btn-dismiss');
    if (dismissButton) {
        dismissButton.addEventListener('click', () => {
            document.getElementById('install-banner').style.display = 'none';
        });
    }

    const installButton = document.getElementById('btn-install');
    if (installButton) {
        installButton.addEventListener('click', async () => {
            if (!deferredPrompt) return;
            deferredPrompt.prompt();
            const { outcome } = await deferredPrompt.userChoice;
            if (outcome === 'accepted') {
                document.getElementById('install-banner').style.display = 'none';
            }
            deferredPrompt = null;
        });
    }

    function copyText(value) {
        if (navigator.clipboard && window.isSecureContext) {
            return navigator.clipboard.writeText(value);
        }
        const field = document.createElement('textarea');
        field.value = value;
        field.setAttribute('readonly', '');
        field.style.position = 'absolute';
        field.style.left = '-9999px';
        document.body.appendChild(field);
        field.select();
        const copied = document.execCommand('copy');
        document.body.removeChild(field);
        return copied ? Promise.resolve() : Promise.reject(new Error('copy failed'));
    }

    function revealAndCopy(secretButton, value) {
        copyText(value)
            .then(() => showToast('Copied to clipboard'))
            .catch(() => showToast('Could not copy', true));

        secretButton.textContent = value;
        setTimeout(() => {
            secretButton.textContent = '•••••• Tap to reveal';
        }, 3500);
    }

    function migrateLegacyData() {
        if (vault.length) return;
        const legacy = safeStorageRead(LEGACY_KEY, []);
        if (!Array.isArray(legacy) || !legacy.length) return;

        vault = legacy.map(item => ({
            id: item.id || Date.now() + Math.floor(Math.random() * 999),
            type: 'TPIN',
            owner: item.owner || 'Legacy Entry',
            secret: item.tpin || '',
            notes: 'Imported from TPIN Vault',
            date: item.date || formatDate()
        })).filter(entry => entry.secret);

        save();
    }

    function addItem() {
        const typeInput = document.getElementById('entryType');
        const ownerInput = document.getElementById('owner');
        const secretInput = document.getElementById('secret');
        const notesInput = document.getElementById('notes');

        const type = typeInput.value.trim();
        const owner = ownerInput.value.trim();
        const secret = secretInput.value.trim();
        const notes = notesInput.value.trim();

        if (!owner || !secret) {
            showToast('Label and value are required', true);
            return;
        }

        vault.unshift({
            id: Date.now() + Math.floor(Math.random() * 1000),
            type,
            owner,
            secret,
            notes,
            date: formatDate()
        });

        ownerInput.value = '';
        secretInput.value = '';
        notesInput.value = '';
        save();
        showToast('Entry saved locally');
    }

    function deleteItem(id) {
        if (!confirm('Delete this entry?')) return;
        vault = vault.filter(item => item.id !== id);
        save();
        showToast('Entry deleted');
    }

    function formatDate() {
        return new Date().toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' });
    }

    function save() {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(vault));
        render();
    }

    function showToast(message, isError = false) {
        const toast = document.getElementById('toast');
        toast.textContent = message;
        toast.style.background = isError ? 'var(--danger)' : 'var(--success)';
        toast.classList.add('show');
        setTimeout(() => toast.classList.remove('show'), 2000);
    }

    function render() {
        const list = document.getElementById('vault-list');
        const query = document.getElementById('search').value.trim().toLowerCase();

        list.innerHTML = '';

        const filtered = vault.filter(item => {
            const haystack = `${item.type} ${item.owner} ${item.notes || ''}`.toLowerCase();
            return haystack.includes(query);
        });

        document.getElementById('vault-meta').textContent = `${vault.length} ${vault.length === 1 ? 'entry' : 'entries'} · Offline ready`;

        if (!filtered.length) {
            const empty = document.createElement('div');
            empty.className = 'empty';
            empty.textContent = vault.length ? 'No match found in your local vault.' : 'No entries yet. Add your first finance credential below.';
            list.appendChild(empty);
            return;
        }

        filtered.forEach(item => {
            const card = document.createElement('article');
            card.className = 'card';

            const top = document.createElement('div');
            top.className = 'row-top';

            const left = document.createElement('div');
            const type = document.createElement('span');
            type.className = 'pill';
            type.textContent = item.type || 'OTHER';

            const owner = document.createElement('div');
            owner.className = 'owner';
            owner.textContent = item.owner || 'Untitled';

            const date = document.createElement('div');
            date.className = 'date';
            date.textContent = item.date || '';

            left.appendChild(type);
            left.appendChild(owner);
            left.appendChild(date);

            if (item.notes) {
                const notes = document.createElement('div');
                notes.className = 'notes';
                notes.textContent = item.notes;
                left.appendChild(notes);
            }

            const del = document.createElement('button');
            del.className = 'btn-danger';
            del.textContent = 'Delete';
            del.addEventListener('click', () => deleteItem(item.id));

            top.appendChild(left);
            top.appendChild(del);

            const bottom = document.createElement('div');
            bottom.className = 'row-main';

            const reveal = document.createElement('button');
            reveal.className = 'secret-trigger';
            reveal.type = 'button';
            reveal.textContent = '•••••• Tap to reveal';
            reveal.addEventListener('click', () => revealAndCopy(reveal, item.secret));

            bottom.appendChild(reveal);

            card.appendChild(top);
            card.appendChild(bottom);
            list.appendChild(card);
        });
    }


    // ── Service Worker ──
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('./sw.js');
        });
    }

    render();
</script>
</body>
</html>
